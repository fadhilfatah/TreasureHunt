<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Treasure Hunt</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --ink: #202020;
      --slate: #575757;
      --paper: #f7f5ef;
      --gold: #f4bb36;
      --green: #3d8b5f;
      --red: #b94a48;
      --line: rgba(255,255,255,.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--paper);
      --background: var(--slate);
      overflow-x: hidden;

      background:#202020;
      background-image:linear-gradient(rgba(255,255,255,.045) 	1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
      background-size:28px 28px;

    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      padding: 28px 16px;
      background:
        linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px),
        var(--slate);
      background-size: 28px 28px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .eyebrow {
      font-family: monospace;
      font-size: .7rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .header {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .compass {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid rgba(244,187,54,.55);
      border-radius: 50%;
      color: var(--gold);
      font-size: 24px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0;
      font-size: clamp(1.7rem, 5vw, 2.5rem);
      line-height: 1.1;
    }

    .header-subtitle {
      margin: 8px 0 0;
      color: rgba(247,245,239,.75);
      line-height: 1.5;
    }

    .panel {
      margin-top: 24px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(0,0,0,.14);
    }

    .setup-title {
      margin-bottom: 20px;
      font-size: 1.35rem;
      font-weight: 700;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 10px;
      background: var(--ink);
      color: #202020;
      outline: none;
    }

    select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(244,187,54,.25);
    }

    .primary-button,
    .secondary-button,
    .feedback-button,
    .restart-button {
      border: 0;
      border-radius: 11px;
      padding: 11px 16px;
      font-weight: 700;
      transition: transform .15s ease, opacity .15s ease;
    }

    .primary-button {
      background: var(--gold);
      color: var(--ink);
    }

    .secondary-button {
      border: 1px solid rgba(255,255,255,.25);
      background: transparent;
      color: var(--paper);
    }

    .primary-button:hover,
    .secondary-button:hover,
    .feedback-button:hover,
    .restart-button:hover {
      transform: translateY(-1px);
    }

    .primary-button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    /* Compact progress */
    .progress-panel {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(0,0,0,.14);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 5px;
      font-size: .8rem;
    }

    .progress-track {
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.15);
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--gold);
      transition: width .35s ease;
    }

    .score {
      color: var(--gold);
      font-weight: 700;
      white-space: nowrap;
    }

    /* Question card */
    .card {
      min-height: 440px;
      padding: clamp(24px, 5vw, 42px);
      border-radius: 22px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 20px 50px rgba(0,0,0,.22);
      display: flex;
      flex-direction: column;
    }

    .question-area {
      flex: 1;
    }

    .question {
      margin: 20px 0 0;
      font-size: clamp(1.45rem, 4vw, 2.1rem);
      line-height: 1.2;
    }

    /* Same-line clue */
    .clue-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      min-height: 32px;
    }

    .clue-toggle {
      padding: 7px 11px;
      border: 1px dashed #aaa;
      border-radius: 9px;
      background: transparent;
      color: #666;
      font-size: .85rem;
      font-weight: 600;
    }

    .clue-toggle:hover {
      background: #eeeae1;
    }

    .clue {
      margin: 0;
      color: #666;
      font-size: .9rem;
      font-style: italic;
      line-height: 1.4;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px;
      margin-top: 28px;
    }

    .answer-button {
      position: relative;
      min-height: 66px;
      padding: 14px 16px;
      border: 2px solid #d8d3c8;
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      text-align: left;
      font-weight: 600;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }

    .answer-button:hover:not(:disabled) {
      border-color: #999;
      transform: translateY(-1px);
    }

    .answer-button:disabled {
      cursor: default;
    }

    .answer-button.correct {
      border-color: var(--green);
      background: #e7f3eb;
    }

    .answer-button.incorrect {
      border-color: var(--red);
      background: #f8e5e4;
    }

    .answer-button.correct::after {
      content: "✓";
      position: absolute;
      top: 9px;
      right: 12px;
      color: var(--green);
      font-size: 18px;
      font-weight: 800;
    }

    .answer-button.incorrect::after {
      content: "✕";
      position: absolute;
      top: 9px;
      right: 12px;
      color: var(--red);
      font-size: 18px;
      font-weight: 800;
    }

    .answer-message {
      min-height: 24px;
      margin-top: 14px;
      font-weight: 700;
    }

    .answer-message.correct-message {
      color: var(--green);
    }

    .answer-message.incorrect-message {
      color: var(--red);
    }

    .explanation {
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      background: #ebe7dd;
      color: #444;
      line-height: 1.55;
    }

    .next-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    /* Metadata */
    .metadata {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #ddd7ca;
    }

    .metadata-tag {
      display: inline-flex;
      width: fit-content;
      padding: 5px 9px;
      border-radius: 999px;
      background: #e5dfd2;
      color: #575757;
      font-family: monospace;
      font-size: .66rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    /* Completion */
    .completion {
      margin-top: 24px;
    }

    .completion-score {
      margin: 4px 0 24px;
      color: var(--gold);
      font-size: 2.8rem;
      font-weight: 800;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .review-item {
      border: 1px solid #d8d3c8;
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }

    .review-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
      border: 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
      font-weight: 600;
    }

    .review-button:hover {
      background: #f4f1ea;
    }

    .review-status {
      width: 22px;
      flex: 0 0 22px;
      font-weight: 800;
    }

    .review-status.correct {
      color: var(--green);
    }

    .review-status.incorrect {
      color: var(--red);
    }

    .review-question {
      flex: 1;
    }

    .review-details {
      display: none;
      padding: 0 14px 16px 46px;
      color: #555;
      line-height: 1.5;
    }

    .review-item.open .review-details {
      display: block;
    }

    .review-answer {
      margin-top: 10px;
    }

    .review-correct {
      color: var(--green);
      font-weight: 700;
    }

    .review-feedback {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #ddd7ca;
    }

    .feedback-label {
      width: 100%;
      margin-bottom: 2px;
      font-size: .8rem;
      font-weight: 700;
    }

    .feedback-button {
      padding: 7px 10px;
      border: 1px solid #d0cabd;
      background: #f7f5ef;
      color: #444;
      font-size: .8rem;
    }

    .feedback-button.selected-good {
      border-color: var(--green);
      background: #e7f3eb;
    }

    .feedback-button.selected-bad {
      border-color: var(--red);
      background: #f8e5e4;
    }

    .feedback-status {
      font-size: .78rem;
      color: #777;
    }

    .hidden {
      display: none !important;
    }

    .notice {
      min-height: 20px;
      margin-top: 12px;
      color: #ffd;
      font-size: .85rem;
    }

    .error {
      color: #ffd1d1;
    }

    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .answers {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 470px;
      }

      .progress-panel {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app-shell">

  <div class="container">

    <!-- HEADER -->
    <header class="header">
      <div class="compass">⌖</div>

      <div>
        <div class="eyebrow">Treasure Hunt</div>
        <h1>Question Challenge</h1>
      </div>
    </header>


    <!-- SETUP SCREEN -->
    <section id="setupScreen" class="panel">

      <h2 class="setup-title">Set Up Your Hunt</h2>

      <div class="form-grid">

        <div class="field">
          <label for="questionCount">Number of Questions</label>

          <select id="questionCount">
            <option value="5">5 Questions</option>
            <option value="10" selected>10 Questions</option>
          </select>
        </div>


        <div class="field">
          <label for="difficultyFilter">Difficulty</label>

          <select id="difficultyFilter">
            <option value="">Any Difficulty</option>
          </select>
        </div>


        <div class="field">
          <label for="sourceFilter">Source</label>

          <select id="sourceFilter">
            <option value="">Any Source</option>
          </select>
        </div>


        <div class="field">
          <label for="typeFilter">Question Type</label>

          <select id="typeFilter">
            <option value="">Any Question Type</option>
          </select>
        </div>

      </div>


      <div class="button-row">

        <button
          id="startButton"
          class="primary-button"
          type="button"
        >
          Start Hunt
        </button>

      </div>


      <p id="setupNotice" class="notice"></p>

    </section>


    <!-- GAME SCREEN -->
    <main id="gameScreen" class="hidden">

      <section class="progress-panel">

        <div>

          <div class="progress-info">
            <span id="progressText">Question 1 / 10</span>
          </div>

          <div class="progress-track">
            <div
              id="progressFill"
              class="progress-fill"
              style="width:0%"
            ></div>
          </div>

        </div>

        <div class="score">
          Score: <span id="score">0</span>
        </div>

      </section>


      <section id="cardContainer"></section>


      <div class="button-row">

        <button
          id="restartButton"
          class="secondary-button"
          type="button"
        >
          Restart
        </button>

      </div>

    </main>


    <!-- COMPLETION SCREEN -->
    <section id="completionScreen" class="panel completion hidden">

      <div class="eyebrow">Round Complete</div>

      <h2>Well Done!</h2>

      <div id="completionScore" class="completion-score">
        0 / 10
      </div>

      <p>
        Tap a question below to review your answer and explanation.
      </p>


      <div id="reviewList" class="review-list"></div>


      <div class="button-row">

        <button
          id="completionRestartButton"
          class="primary-button"
          type="button"
        >
          Start Another Round
        </button>

      </div>

    </section>


    <p id="globalNotice" class="notice"></p>

  </div>

</div>


<script>

  /*
   * ==========================================================
   * CONFIGURATION
   * ==========================================================
   */

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwCxD3k4UP5rngZvfoVAAkcKq0dXT77-lm7_wvizCF_OOC9g9S02u9qlLfbhDJXz1NL0Q/exec";


  /*
   * ==========================================================
   * APPLICATION STATE
   * ==========================================================
   */

  const state = {

    records: [],

    roundQuestions: [],

    currentIndex: 0,

    score: 0,

    answers: [],

    roundId: "",

    questionCount: 10,

    difficulty: "",

    source: "",

    questionType: ""

  };


  /*
   * ==========================================================
   * DOM HELPERS
   * ==========================================================
   */

  const $ = id => document.getElementById(id);


  /*
   * ==========================================================
   * INITIALISE
   * ==========================================================
   */

  document.addEventListener("DOMContentLoaded", async () => {

    $("startButton").addEventListener(
      "click",
      startRound
    );

    $("restartButton").addEventListener(
      "click",
      confirmRestart
    );

    $("completionRestartButton").addEventListener(
      "click",
      confirmRestart
    );

    await loadQuestionBank();

  });


  /*
   * ==========================================================
   * LOAD QUESTION BANK
   *
   * Reads the published Google Sheets CSV.
   * ==========================================================
   */

  async function loadQuestionBank() {

    try {

      $("setupNotice").textContent =
        "Loading question bank...";


      const csvUrl =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5pyFbxrbzTpAcFyStBf29mZxLayBSl2izWxwzEmqIw2OYGg49Sm2HBors6dczcRvKfOz6PT2Y8qxX/pub?gid=0&single=true&output=csv";


      const response = await fetch(
        csvUrl + "&t=" + Date.now()
      );


      if (!response.ok) {
        throw new Error(
          "Unable to load Google Sheets data."
        );
      }


      const csvText = await response.text();

      state.records = parseCSV(csvText)
        .filter(record => record.No !== "");


      if (!state.records.length) {
        throw new Error(
          "No questions were found."
        );
      }


      populateFilters();

      $("setupNotice").textContent =
        state.records.length +
        " questions loaded.";


    } catch (error) {

      console.error(error);

      $("setupNotice").textContent =
        "Unable to load the question bank.";

      $("setupNotice").classList.add("error");

    }

  }


  /*
   * ==========================================================
   * CSV PARSER
   * ==========================================================
   */

  function parseCSV(text) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (let i = 0; i < text.length; i++) {

      const char = text[i];

      const next = text[i + 1];


      if (char === '"' && insideQuotes && next === '"') {

        value += '"';

        i++;

        continue;

      }


      if (char === '"') {

        insideQuotes = !insideQuotes;

        continue;

      }


      if (char === "," && !insideQuotes) {

        row.push(value);

        value = "";

        continue;

      }


      if (
        (char === "\n" || char === "\r") &&
        !insideQuotes
      ) {

        if (char === "\r" && next === "\n") {
          i++;
        }

        row.push(value);

        rows.push(row);

        row = [];

        value = "";

        continue;

      }


      value += char;

    }


    if (value !== "" || row.length) {

      row.push(value);

      rows.push(row);

    }


    if (!rows.length) {
      return [];
    }


    const headers = rows[0].map(
      header => header.trim()
    );


    return rows
      .slice(1)
      .map(columns => {

        const record = {};

        headers.forEach((header, index) => {

          record[header] =
            (columns[index] || "").trim();

        });

        return record;

      });

  }


  /*
   * ==========================================================
   * FILTERS
   * ==========================================================
   */

  function populateFilters() {

    populateSelect(
      $("difficultyFilter"),
      uniqueValues("Difficulty"),
      "Any Difficulty"
    );


    populateSelect(
      $("sourceFilter"),
      uniqueValues("Source"),
      "Any Source"
    );


    populateSelect(
      $("typeFilter"),
      uniqueValues("Question Type"),
      "Any Question Type"
    );

  }


  function uniqueValues(column) {

    return [
      ...new Set(
        state.records
          .map(record => record[column])
          .filter(Boolean)
      )
    ].sort();

  }


  function populateSelect(
    select,
    values,
    defaultLabel
  ) {

    select.innerHTML = "";

    const defaultOption =
      document.createElement("option");

    defaultOption.value = "";

    defaultOption.textContent = defaultLabel;

    select.appendChild(defaultOption);


    values.forEach(value => {

      const option =
        document.createElement("option");

      option.value = value;

      option.textContent = value;

      select.appendChild(option);

    });

  }


  /*
   * ==========================================================
   * START ROUND
   * ==========================================================
   */

  function startRound() {

    const count =
      Number($("questionCount").value);


    const difficulty =
      $("difficultyFilter").value;

    const source =
      $("sourceFilter").value;

    const questionType =
      $("typeFilter").value;


    let pool =
      state.records.filter(record => {

        if (
          difficulty &&
          record.Difficulty !== difficulty
        ) {
          return false;
        }


        if (
          source &&
          record.Source !== source
        ) {
          return false;
        }


        if (
          questionType &&
          record["Question Type"] !== questionType
        ) {
          return false;
        }


        return true;

      });


    if (pool.length < count) {

      $("setupNotice").textContent =
        "There are only " +
        pool.length +
        " questions matching your selected filters.";

      $("setupNotice").classList.add("error");

      return;

    }


    /*
     * Randomise the matching pool.
     */

    pool = shuffleArray(pool);


    state.roundQuestions =
      pool.slice(0, count);

    state.currentIndex = 0;

    state.score = 0;

    state.answers = [];

    state.questionCount = count;

    state.difficulty = difficulty;

    state.source = source;

    state.questionType = questionType;

    state.roundId = generateRoundId();


    $("setupScreen").classList.add("hidden");

    $("completionScreen").classList.add("hidden");

    $("gameScreen").classList.remove("hidden");

    $("score").textContent = "0";

    showCurrentQuestion();

  }


  /*
   * ==========================================================
   * SHOW CURRENT QUESTION
   * ==========================================================
   */

  function showCurrentQuestion() {

    const record =
      state.roundQuestions[state.currentIndex];


    if (!record) {

      completeRound();

      return;

    }


    const card =
      document.createElement("article");

    card.className = "card";


    const questionArea =
      document.createElement("div");

    questionArea.className = "question-area";


    const question =
      document.createElement("h2");

    question.className = "question";

    question.textContent =
      record.Question;


    /*
     * Clue row
     */

    const clueRow =
      document.createElement("div");

    clueRow.className = "clue-row";


    if (record.Clue) {

      const clueToggle =
        document.createElement("button");

      clueToggle.type = "button";

      clueToggle.className =
        "clue-toggle";

      clueToggle.textContent =
        "💡 Show Clue";


      const clue =
        document.createElement("p");

      clue.className = "clue hidden";

      clue.textContent =
        "Clue: " + record.Clue;


      clueToggle.addEventListener(
        "click",
        () => {

          clue.classList.toggle("hidden");

          clueToggle.textContent =
            clue.classList.contains("hidden")
              ? "💡 Show Clue"
              : "💡 Hide Clue";

        }
      );


      clueRow.appendChild(clueToggle);

      clueRow.appendChild(clue);

    }


    questionArea.appendChild(question);

    questionArea.appendChild(clueRow);


    /*
     * Answers
     */

    const answers =
      document.createElement("div");

    answers.className = "answers";


    const choices = [

      record.A,
      record.B,
      record.C,
      record.D

    ].filter(Boolean);


    /*
     * Randomise answer display positions.
     */

    const shuffledChoices =
      shuffleArray(
        choices.map(choice => ({
          text: choice,
          correct:
            choice === record.Answer
        }))
      );


    shuffledChoices.forEach(choice => {

      const button =
        document.createElement("button");

      button.type = "button";

      button.className =
        "answer-button";

      /*
       * No A/B/C/D labels are displayed.
       */

      button.textContent =
        choice.text;


      button.addEventListener(
        "click",
        () => handleAnswer(
          button,
          choice,
          record,
          shuffledChoices
        )
      );


      answers.appendChild(button);

    });


    questionArea.appendChild(answers);


    /*
     * Answer message
     */

    const answerMessage =
      document.createElement("div");

    answerMessage.className =
      "answer-message";


    questionArea.appendChild(
      answerMessage
    );


    /*
     * Explanation
     */

    const explanation =
      document.createElement("div");

    explanation.className =
      "explanation hidden";

    explanation.textContent =
      record.Explanation || "";


    questionArea.appendChild(
      explanation
    );


    /*
     * Metadata at bottom
     */

    const metadata =
      document.createElement("div");

    metadata.className =
      "metadata";


    addMetadataTag(
      metadata,
      record["Question Type"]
    );

    addMetadataTag(
      metadata,
      record.Difficulty
    );

    addMetadataTag(
      metadata,
      record.Source
    );


    card.appendChild(questionArea);

    card.appendChild(metadata);


    /*
     * Next button
     */

    const nextRow =
      document.createElement("div");

    nextRow.className =
      "next-row hidden";


    const nextButton =
      document.createElement("button");

    nextButton.type = "button";

    nextButton.className =
      "primary-button";

    nextButton.textContent =
      state.currentIndex ===
      state.roundQuestions.length - 1
        ? "Finish Round"
        : "Next Question";


    nextButton.addEventListener(
      "click",
      () => {

        state.currentIndex++;

        showCurrentQuestion();

      }
    );


    nextRow.appendChild(nextButton);

    card.appendChild(nextRow);


    $("cardContainer").replaceChildren(card);


    updateProgress();


    /*
     * Tell Apps Script that this question
     * has been served.
     */

    sendEvent({

      action: "question_served",

      roundId: state.roundId,

      questionId: record.No,

      difficulty: record.Difficulty,

      source: record.Source,

      questionType:
        record["Question Type"]

    });

  }


  /*
   * ==========================================================
   * ANSWER
   * ==========================================================
   */

  function handleAnswer(
    clickedButton,
    selectedChoice,
    record,
    allChoices
  ) {

    const buttons =
      $("cardContainer")
        .querySelectorAll(".answer-button");


    buttons.forEach(
      button => button.disabled = true
    );


    const correct =
      selectedChoice.correct;


    if (correct) {

      clickedButton.classList.add(
        "correct"
      );

      state.score++;

      $("score").textContent =
        state.score;

      $("cardContainer")
        .querySelector(".answer-message")
        .textContent =
        "✓ Correct!";

      $("cardContainer")
        .querySelector(".answer-message")
        .className =
        "answer-message correct-message";

    }

    else {

      clickedButton.classList.add(
        "incorrect"
      );


      /*
       * Highlight the correct answer.
       */

      buttons.forEach(button => {

        if (
          button.textContent ===
          record.Answer
        ) {

          button.classList.add(
            "correct"
          );

        }

      });


      $("cardContainer")
        .querySelector(".answer-message")
        .textContent =
        "✕ Incorrect.";

      $("cardContainer")
        .querySelector(".answer-message")
        .className =
        "answer-message incorrect-message";

    }


    const explanation =
      $("cardContainer")
        .querySelector(".explanation");

    explanation.classList.remove(
      "hidden"
    );


    const nextRow =
      $("cardContainer")
        .querySelector(".next-row");

    nextRow.classList.remove(
      "hidden"
    );


    state.answers.push({

      questionId: record.No,

      question: record.Question,

      selectedAnswer:
        selectedChoice.text,

      correctAnswer:
        record.Answer,

      correct: correct,

      explanation:
        record.Explanation,

      difficulty:
        record.Difficulty,

      source:
        record.Source,

      questionType:
        record["Question Type"],

      feedback: null

    });


    /*
     * Send answer to Google Sheets.
     */

    sendEvent({

      action: "answer",

      roundId: state.roundId,

      questionId: record.No,

      selectedAnswer:
        selectedChoice.text,

      correctAnswer:
        record.Answer,

      correct: correct,

      difficulty:
        record.Difficulty,

      source:
        record.Source,

      questionType:
        record["Question Type"]

    });

  }


  /*
   * ==========================================================
   * COMPLETE ROUND
   * ==========================================================
   */

  function completeRound() {

    $("gameScreen").classList.add(
      "hidden"
    );

    $("completionScreen").classList.remove(
      "hidden"
    );


    $("completionScore").textContent =
      state.score +
      " / " +
      state.roundQuestions.length;


    buildReviewList();

  }


  /*
   * ==========================================================
   * REVIEW LIST
   * ==========================================================
   */

  function buildReviewList() {

    const list =
      $("reviewList");


    list.replaceChildren();


    state.answers.forEach(
      (answer, index) => {

        const item =
          document.createElement("div");

        item.className =
          "review-item";


        const reviewButton =
          document.createElement("button");

        reviewButton.type = "button";

        reviewButton.className =
          "review-button";


        const status =
          document.createElement("span");

        status.className =
          "review-status " +
          (answer.correct
            ? "correct"
            : "incorrect");

        status.textContent =
          answer.correct
            ? "✓"
            : "✕";


        const questionText =
          document.createElement("span");

        questionText.className =
          "review-question";

        questionText.textContent =
          answer.question;


        reviewButton.appendChild(status);

        reviewButton.appendChild(
          questionText
        );


        const details =
          document.createElement("div");

        details.className =
          "review-details";


        const selected =
          document.createElement("div");

        selected.className =
          "review-answer";

        selected.innerHTML =
          "<strong>Your answer:</strong> " +
          escapeHTML(
            answer.selectedAnswer
          );


        const correct =
          document.createElement("div");

        correct.className =
          "review-answer";

        correct.innerHTML =
          "<strong>Correct answer:</strong> " +
          "<span class='review-correct'>" +
          escapeHTML(
            answer.correctAnswer
          ) +
          "</span>";


        const explanation =
          document.createElement("div");

        explanation.className =
          "review-answer";

        explanation.innerHTML =
          "<strong>Explanation:</strong><br>" +
          escapeHTML(
            answer.explanation || ""
          );


        /*
         * Metadata
         */

        const metadata =
          document.createElement("div");

        metadata.className =
          "metadata";


        addMetadataTag(
          metadata,
          answer.questionType
        );

        addMetadataTag(
          metadata,
          answer.difficulty
        );

        addMetadataTag(
          metadata,
          answer.source
        );


        /*
         * Feedback
         */

        const feedback =
          document.createElement("div");

        feedback.className =
          "review-feedback";


        const feedbackLabel =
          document.createElement("div");

        feedbackLabel.className =
          "feedback-label";

        feedbackLabel.textContent =
          "How was this question?";


        const goodButton =
          document.createElement("button");

        goodButton.type = "button";

        goodButton.className =
          "feedback-button";

        goodButton.textContent =
          "👍 Good Question";


        const badButton =
          document.createElement("button");

        badButton.type = "button";

        badButton.className =
          "feedback-button";

        badButton.textContent =
          "👎 Needs Improvement";


        const feedbackStatus =
          document.createElement("span");

        feedbackStatus.className =
          "feedback-status";


        goodButton.addEventListener(
          "click",
          () => submitFeedback(
            answer,
            "good",
            goodButton,
            badButton,
            feedbackStatus
          )
        );


        badButton.addEventListener(
          "click",
          () => submitFeedback(
            answer,
            "bad",
            goodButton,
            badButton,
            feedbackStatus
          )
        );


        feedback.appendChild(
          feedbackLabel
        );

        feedback.appendChild(
          goodButton
        );

        feedback.appendChild(
          badButton
        );

        feedback.appendChild(
          feedbackStatus
        );


        details.appendChild(
          selected
        );

        details.appendChild(
          correct
        );

        details.appendChild(
          explanation
        );

        details.appendChild(
          metadata
        );

        details.appendChild(
          feedback
        );


        reviewButton.addEventListener(
          "click",
          () => {

            item.classList.toggle(
              "open"
            );

          }
        );


        item.appendChild(
          reviewButton
        );

        item.appendChild(
          details
        );


        list.appendChild(item);

      }
    );

  }


  /*
   * ==========================================================
   * FEEDBACK
   * ==========================================================
   */

  function submitFeedback(
    answer,
    feedback,
    goodButton,
    badButton,
    statusElement
  ) {

    /*
     * Prevent duplicate feedback.
     */

    if (answer.feedback) {

      statusElement.textContent =
        "Feedback already submitted.";

      return;

    }


    answer.feedback = feedback;


    if (feedback === "good") {

      goodButton.classList.add(
        "selected-good"
      );

      statusElement.textContent =
        "Thank you!";

    }

    else {

      badButton.classList.add(
        "selected-bad"
      );

      statusElement.textContent =
        "Thank you!";

    }


    goodButton.disabled = true;

    badButton.disabled = true;


    sendEvent({

      action: "feedback",

      roundId: state.roundId,

      questionId: answer.questionId,

      feedback: feedback,

      difficulty: answer.difficulty,

      source: answer.source,

      questionType: answer.questionType

    });

  }


  /*
   * ==========================================================
   * PROGRESS
   * ==========================================================
   */

  function updateProgress() {

    const total =
      state.roundQuestions.length;


    const current =
      state.currentIndex + 1;


    $("progressText").textContent =
      "Question " +
      Math.min(current, total) +
      " / " +
      total;


    const percentage =
      total
        ? (current / total) * 100
        : 0;


    $("progressFill").style.width =
      Math.min(percentage, 100) + "%";

  }


  /*
   * ==========================================================
   * RESTART
   * ==========================================================
   */

  function confirmRestart() {

    const confirmed =
      window.confirm(
        "Are you sure you want to restart? Your current round progress will be lost."
      );


    if (!confirmed) {
      return;
    }


    state.roundQuestions = [];

    state.currentIndex = 0;

    state.score = 0;

    state.answers = [];

    state.roundId = "";


    $("gameScreen").classList.add(
      "hidden"
    );

    $("completionScreen").classList.add(
      "hidden"
    );

    $("setupScreen").classList.remove(
      "hidden"
    );


    $("cardContainer").replaceChildren();

  }


  /*
   * ==========================================================
   * GOOGLE APPS SCRIPT
   * ==========================================================
   */

  function sendEvent(data) {

    /*
     * The quiz does not wait for the server.
     *
     * This prevents a temporary Google Apps Script
     * connection issue from stopping the game.
     */

    fetch(
      APPS_SCRIPT_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify(data)

      }
    )
    .then(response => {

      if (!response.ok) {

        console.warn(
          "Apps Script request failed."
        );

      }

    })
    .catch(error => {

      console.warn(
        "Unable to send event to Google Sheets:",
        error
      );

    });

  }


  /*
   * ==========================================================
   * ROUND ID
   * ==========================================================
   */

  function generateRoundId() {

    const now =
      new Date();


    const date =
      now.getFullYear() +
      String(
        now.getMonth() + 1
      ).padStart(2, "0") +
      String(
        now.getDate()
      ).padStart(2, "0");


    const random =
      Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase();


    return "R-" + date + "-" + random;

  }


  /*
   * ==========================================================
   * SHUFFLE
   * ==========================================================
   */

  function shuffleArray(array) {

    const copy =
      [...array];


    for (
      let i = copy.length - 1;
      i > 0;
      i--
    ) {

      const j =
        Math.floor(
          Math.random() * (i + 1)
        );


      [
        copy[i],
        copy[j]
      ] = [
        copy[j],
        copy[i]
      ];

    }


    return copy;

  }


  /*
   * ==========================================================
   * METADATA TAG
   * ==========================================================
   */

  function addMetadataTag(
    container,
    value
  ) {

    if (!value) {
      return;
    }


    const tag =
      document.createElement("span");

    tag.className =
      "metadata-tag";

    tag.textContent =
      value;


    container.appendChild(tag);

  }


  /*
   * ==========================================================
   * HTML ESCAPING
   * ==========================================================
   */

  function escapeHTML(value) {

    return String(value || "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }

</script>
